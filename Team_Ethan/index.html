<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Floorboard Volume</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay" id="scare-overlay"></div>
    <div class="container">
        <h1>Master Volume</h1>
        <h2 id="volume-display">0%</h2>
        
        <div id="slider-area">
            <div id="track"></div>
            <div id="fill"></div>
            <div id="knob"></div>
        </div>
        
        <p id="instruction">Drag slowly. Do not wake it up.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
