<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Distance Audio Interaction</title>

<style>
body {
  margin: 0;
  background: #0f172a;
  overflow: hidden;
  font-family: sans-serif;
}

/* Stage */
#stage {
  position: relative;
  width: 100%;
  height: 100vh;
}

/* Volume UI */
#vol {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: #94a3b8;
  font-size: 14px;
}

/* Avatars */
.avatar-wrap {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.avatar-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #334155;
  transition: 0.3s;
}

/* subtle effect */
.avatar-img {
  filter: grayscale(100%);
}
.avatar-wrap:hover .avatar-img {
  filter: grayscale(0%);
}

/* Labels */
.avatar-label {
  margin-top: 6px;
  font-size: 12px;
  color: #94a3b8;
}

/* Drag cursor */
#girl-wrap {
  cursor: grab;
}
#girl-wrap.dragging {
  cursor: grabbing;
}
</style>

</head>

<body>

<div id="stage">

  <div id="vol">Volume: 0</div>

  <!-- Yuzi -->

  <div class="avatar-wrap" id="boy-wrap">
    <img src="WhatsApp Image 2026-04-15 at 3.31.24 PM.jpeg" class="avatar-img">
    <span class="avatar-label">Yuzi</span>
  </div>

  <!-- Mahvash -->

  <div class="avatar-wrap" id="girl-wrap">
    <img src="WhatsApp Image 2026-04-15 at 3.32.29 PM.jpeg" class="avatar-img">
    <span class="avatar-label">Mahvash</span>
  </div>

</div>

<audio id="music" loop></audio>

<script>
const stage = document.getElementById("stage");
const boy = document.getElementById("boy-wrap");
const girl = document.getElementById("girl-wrap");
const music = document.getElementById("music");
const volText = document.getElementById("vol");

/* 🔥 PUT YOUR AUDIO URL HERE */
music.src = "yapapa_cat.mp3";

let dragging = false;
let bx, by, gx, gy;
const R = 55;

/* Start audio */
document.body.addEventListener("click", () => {
  music.play();
}, { once: true });

/* Position setup */
function place() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  bx = w / 2;
  by = h / 2;

  gx = 120;
  gy = 120;

  moveElement(boy, bx, by);
  moveElement(girl, gx, gy);
}

function moveElement(el, x, y) {
  el.style.left = (x - R) + "px";
  el.style.top = (y - R) + "px";
}

/* Drag */
girl.addEventListener("mousedown", () => {
  dragging = true;
  girl.classList.add("dragging");
});

document.addEventListener("mouseup", () => {
  dragging = false;
  girl.classList.remove("dragging");
});

document.addEventListener("mousemove", (e) => {
  if (!dragging) return;

  gx = e.clientX;
  gy = e.clientY;

  moveElement(girl, gx, gy);
  updateVolume();
});

/* Volume logic */
function updateVolume() {
  const dx = bx - gx;
  const dy = by - gy;

  const distance = Math.hypot(dx, dy);
  const maxDistance = Math.max(window.innerWidth, window.innerHeight);

  let volume = 1 - (distance / maxDistance);

  volume = volume * volume; // smoother curve

  volume = Math.max(0, Math.min(1, volume));

  music.volume = volume;

  volText.innerText = "Volume: " + Math.round(volume * 100);
}

/* Init */
place();
updateVolume();
window.addEventListener("resize", place);
</script>

</body>
</html>
