<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ear-Eraser 3000</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@300;700&display=swap');

        body {
            background-color: #0a0a0a;
            color: #ff0055;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
        }

        .glitch-text {
            font-family: 'Permanent Marker', cursive;
            text-shadow: 2px 2px #00ffff, -2px -2px #ff0055;
            animation: jitter 0.2s infinite alternate;
        }

        @keyframes jitter {
            0% { transform: translate(0); }
            100% { transform: translate(1px, -1px); }
        }

        #slider-container {
            position: absolute;
            transition: all 0.2s cubic-bezier(0.19, 1, 0.22, 1);
            background: #1a1a1a;
            padding: 24px;
            border: 4px solid #ff0055;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
            z-index: 50;
            pointer-events: auto;
            user-select: none;
        }

        #force-field {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border: 2px dashed rgba(255, 0, 85, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 40;
            transition: opacity 0.5s;
        }

        .stable {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            transform: none !important;
            transition: all 1s ease-in-out !important;
            border-color: #00ff88 !important;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5) !important;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 200px;
            background: transparent;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ff0055;
            cursor: not-allowed;
            margin-top: -8px;
            box-shadow: 0 0 10px #ff0055;
        }

        .btn {
            background: #ff0055;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ff0055;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            animation: slideIn 0.3s forwards;
            z-index: 100;
            font-weight: bold;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        #progress-bar-container {
            width: 300px;
            height: 10px;
            background: #222;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
            border: 1px solid #333;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            background: #ff0055;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="text-center mb-8 select-none">
        <h1 class="text-6xl font-bold glitch-text mb-4 uppercase">System Restricted</h1>
        <p class="text-gray-400 italic">"The harder you try, the louder it gets."</p>
    </div>

    <!-- MAIN CONTROLS -->
    <div class="flex flex-col items-center gap-4 mb-20 z-50 relative">
        <div class="flex gap-4">
            <button id="play-btn" class="btn bg-green-500 hover:bg-green-400">Play</button>
            <button id="pause-btn" class="btn bg-red-600 hover:bg-red-500">Pause</button>
        </div>
        
        <div id="progress-bar-container">
            <div id="progress-fill"></div>
        </div>
    </div>

    <!-- THE CHAOTIC SLIDER -->
    <div id="slider-container">
        <label class="block mb-2 font-bold uppercase text-xs tracking-widest text-pink-400">Forbidden Volume</label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
        <div class="flex justify-between font-mono mt-2 text-[10px]">
            <span id="vol-text">VOL: 50%</span>
            <span id="speed-text">SPD: 1.0x</span>
        </div>
    </div>

    <div id="force-field"></div>
    <div id="msg-box" class="notification">PAUSE IS NOT PERMITTED.</div>

    <!-- AUDIO SOURCE -->
    <audio id="main-audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <script>
        const audio = document.getElementById('main-audio');
        const sliderContainer = document.getElementById('slider-container');
        const forceField = document.getElementById('force-field');
        const volumeSlider = document.getElementById('volume-slider');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const volText = document.getElementById('vol-text');
        const speedText = document.getElementById('speed-text');
        const progressFill = document.getElementById('progress-fill');
        const msgBox = document.getElementById('msg-box');

        let phase = "chaos";
        const DETECTION_RADIUS = 300;
        const ESCAPE_DISTANCE = 350;

        // --- PHASE 1: CHAOTIC MOVEMENT ---
        function flee(cursorX, cursorY) {
            if (phase !== "chaos" || audio.paused) return;

            const rect = sliderContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Vector away from cursor
            let dx = centerX - cursorX;
            let dy = centerY - cursorY;
            const magnitude = Math.sqrt(dx*dx + dy*dy) || 1;
            
            let targetX = centerX + (dx / magnitude) * ESCAPE_DISTANCE;
            let targetY = centerY + (dy / magnitude) * ESCAPE_DISTANCE;

            // Boundary clamping
            const pad = 60;
            targetX = Math.max(pad, Math.min(window.innerWidth - rect.width - pad, targetX));
            targetY = Math.max(pad, Math.min(window.innerHeight - rect.height - pad, targetY));

            // Corner jump if stuck
            if (Math.abs(targetX - rect.left) < 5 && Math.abs(targetY - rect.top) < 5) {
                targetX = Math.random() * (window.innerWidth - rect.width);
                targetY = Math.random() * (window.innerHeight - rect.height);
            }

            sliderContainer.style.left = `${targetX}px`;
            sliderContainer.style.top = `${targetY}px`;
            
            // Penalties: Volume +10%, Speed +0.1
            audio.volume = Math.min(1, audio.volume + 0.1);
            audio.playbackRate = Math.min(4, audio.playbackRate + 0.1);
            updateUI();
        }

        function updateUI() {
            volText.innerText = `VOL: ${Math.round(audio.volume * 100)}%`;
            speedText.innerText = `SPD: ${audio.playbackRate.toFixed(1)}x`;
            volumeSlider.value = audio.volume;
        }

        // Global mouse tracking for the flee mechanic
        window.addEventListener('mousemove', (e) => {
            if (phase !== "chaos" || audio.paused) return;

            const rect = sliderContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const dist = Math.sqrt(Math.pow(e.clientX-centerX, 2) + Math.pow(e.clientY-centerY, 2));

            // Update force field visual position
            forceField.style.left = `${centerX}px`;
            forceField.style.top = `${centerY}px`;

            if (dist < DETECTION_RADIUS) {
                flee(e.clientX, e.clientY);
            }
        });

        // Volume slider interaction (if you can catch it)
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            updateUI();
        });

        // Progress bar updates
        audio.addEventListener('timeupdate', () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${pct}%`;
        });

        // --- BUTTONS ---
        playBtn.addEventListener('click', () => {
            // PHASE RESET
            phase = "chaos";
            sliderContainer.classList.remove('stable');
            sliderContainer.style.transform = 'none';
            forceField.style.opacity = "1";
            
            audio.playbackRate = 1.0; // Reset speed
            audio.play();
            updateUI();
            
            // Random start jump
            sliderContainer.style.left = `${Math.random() * 70 + 10}%`;
            sliderContainer.style.top = `${Math.random() * 70 + 10}%`;
        });

        pauseBtn.addEventListener('click', () => {
            // BETRAYAL: Pause doesn't work
            msgBox.style.display = 'block';
            setTimeout(() => { msgBox.style.display = 'none'; }, 2000);
            
            // Hidden punishment
            audio.volume = Math.min(1, audio.volume + 0.05);
            updateUI();
        });

        // --- PHASE 2: END-OF-TRACK ILLUSION ---
        audio.addEventListener('ended', () => {
            phase = "stable";
            sliderContainer.classList.add('stable');
            forceField.style.opacity = "0";
            
            // Smoothly center
            sliderContainer.style.left = '50%';
            sliderContainer.style.top = '50%';
            sliderContainer.style.transform = 'translate(-50%, -50%)';
            
            audio.playbackRate = 1.0;
            updateUI();
        });

        // Init
        window.addEventListener('load', () => {
            sliderContainer.style.left = '80%';
            sliderContainer.style.top = '80%';
            updateUI();
        });
    </script>
</body>
</html>
